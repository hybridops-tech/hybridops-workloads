# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-GB
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  changed_files_summary: true
  review_status: true
  review_details: false
  poem: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: false
  sequence_diagrams: false
  slop_detection:
    enabled: false
  path_filters:
    - "!**/.DS_Store"
    - "!**/*.sha256"
    - "!**/*.tar.gz"
    - "!**/*.zip"
  path_instructions:
    - path: "apps/**"
      instructions: >-
        Check workload portability, Kustomize consistency, least privilege,
        secret handling, health probes, stable configuration, and safe rollout
        behaviour across public targets.
    - path: "clusters/**"
      instructions: >-
        Check that resource paths exist, application indexes remain aligned,
        overlays target the correct environment, and no private deployment
        details enter the public baseline.
    - path: "scripts/**"
      instructions: >-
        Check strict shell behaviour, quoting, idempotence, portable failure
        handling, bounded side effects, and safe cleanup.
    - path: ".github/workflows/**"
      instructions: >-
        Check least-privilege permissions, deterministic validation, fork
        safety, and consistency with the repository validation contract.
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "[skip review]"
    ignore_usernames:
      - "dependabot[bot]"
      - "github-actions[bot]"
